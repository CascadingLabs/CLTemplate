# Dependency CVE gate (TEMPLATE) — be proactive instead of waiting on Dependabot.
#
# Scanners live as reusable workflows in CascadingLabs/.github. Uncomment the
# job(s) matching this repo's stack. Update the scanners once there; every repo
# inherits the change.
#
#   Python  -> needs pyproject.toml (+ uv.lock)
#   Rust    -> needs Cargo.lock
#   JS/TS   -> needs a lockfile (bun.lock / package-lock.json / pnpm-lock.yaml)
#   Go      -> needs go.mod

name: Security (CVE)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
